<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>MQTT connectivity test</title></head>
<body style="font-family:monospace;background:#111;color:#eee;padding:20px">
<pre id="log">starting…</pre>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
var logEl = document.getElementById('log');
function log(m) { logEl.textContent += '\n' + m; }
log('mqtt lib: ' + (typeof mqtt !== 'undefined' ? 'loaded' : 'FAILED TO LOAD'));
try {
  var client = mqtt.connect('wss://mqtt.eclipseprojects.io:443/mqtt', { connectTimeout: 10000 });
  client.on('connect', function () {
    log('CONNECTED');
    client.subscribe('muse-c4-test/topic', function (err) {
      log(err ? 'subscribe error: ' + err : 'subscribed');
      client.publish('muse-c4-test/topic', 'hello-from-test');
      log('published hello');
    });
  });
  client.on('message', function (topic, msg) { log('MESSAGE on ' + topic + ': ' + msg.toString()); });
  client.on('error', function (e) { log('ERROR: ' + (e && e.message ? e.message : e)); });
  client.on('offline', function () { log('offline'); });
  client.on('reconnect', function () { log('reconnecting…'); });
  setTimeout(function () { log('TIMEOUT 25s reached'); }, 25000);
} catch (e) { log('EXCEPTION: ' + e.message); }
</script>
</body>
</html>
